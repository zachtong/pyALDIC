name: Draft PDF
on:
  push:
    paths:
      - paper_JOSS/**
      - .github/workflows/draft-pdf.yml
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper_JOSS/paper.md
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper_JOSS/paper.pdf
          archive: false
