name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 and 3.14 too: a student installing with pip today most likely
        # has the newest Python, and that path must work as well as ours.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (excluding performance benchmarks)
        env:
          QT_QPA_PLATFORM: offscreen
        # Accuracy regression tests run in CI; performance (perf) tests
        # are skipped because runner CPU varies. Run locally: pytest -m slow
        run: pytest --tb=short -q --ignore=tests/test_reports -m "not perf"
